
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#534AB7;--p50:#EEEDFE;--p100:#CECBF6;--p200:#AFA9EC;--p800:#3C3489;--t:#1D9E75;--t50:#E1F5EE;--t100:#9FE1CB;--t800:#085041}
.app{padding:0.75rem;font-family:var(--font-sans)}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:1.25rem}
.ntab{padding:10px 4px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);cursor:pointer;text-align:center;font-size:13px;font-weight:400;color:var(--color-text-secondary);font-family:var(--font-sans);transition:all 0.15s;line-height:1.3}
.ntab .ni{display:block;font-size:18px;margin-bottom:2px}
.ntab.on{background:#EEEDFE;border-color:#AFA9EC;color:#3C3489;font-weight:500}
.screen{display:none}.screen.on{display:block}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.25rem}
.st{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px 8px;text-align:center}
.st-n{font-size:26px;font-weight:500;color:var(--color-text-primary)}
.st-l{font-size:11px;color:var(--color-text-secondary);margin-top:2px}

.search-box{width:100%;padding:12px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:15px;font-family:var(--font-sans);outline:none;margin-bottom:1rem}
.search-box:focus{border-color:#534AB7}

.wcard{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color 0.15s}
.wcard:hover{border-color:var(--color-border-secondary)}
.wcard.open{border-color:#AFA9EC}
.wc-top{display:flex;align-items:center;gap:10px}
.wc-en{font-size:20px;font-weight:500;color:var(--color-text-primary);flex:1}
.wc-ko{font-size:13px;color:var(--color-text-secondary);background:var(--color-background-secondary);padding:3px 9px;border-radius:100px}
.wc-arr{font-size:14px;color:var(--color-text-tertiary);transition:transform 0.2s}
.wcard.open .wc-arr{transform:rotate(180deg)}
.syn-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;padding-top:14px;border-top:0.5px solid var(--color-border-tertiary)}
.syn-pill{font-size:13px;padding:5px 12px;border-radius:100px;background:#EEEDFE;color:#3C3489;border:0.5px solid #AFA9EC}
.done-pill{background:#E1F5EE;color:#085041;border-color:#9FE1CB}
.wc-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:12px}
.act-btn{font-size:12px;padding:5px 12px;border-radius:100px;border:0.5px solid var(--color-border-secondary);background:transparent;cursor:pointer;color:var(--color-text-secondary);font-family:var(--font-sans)}
.act-btn.done-act{background:#E1F5EE;color:#085041;border-color:#9FE1CB}

.fc-area{perspective:1200px;margin-bottom:1.25rem}
.fc-wrap{height:260px;cursor:pointer}
.fc{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.45s cubic-bezier(0.4,0,0.2,1)}
.fc.flip{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--border-radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary)}
.fc-b{transform:rotateY(180deg)}
.fc-front-word{font-size:40px;font-weight:500;color:var(--color-text-primary);text-align:center;line-height:1.2}
.fc-front-ko{font-size:16px;color:var(--color-text-secondary);margin-top:10px}
.fc-tap{font-size:12px;color:var(--color-text-tertiary);margin-top:16px}
.fc-back-ko{font-size:14px;color:var(--color-text-secondary);margin-bottom:14px}
.fc-back-word{font-size:28px;font-weight:500;color:#3C3489;margin-bottom:14px;text-align:center}
.fc-syns{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}

.prog-bar{height:3px;background:var(--color-background-secondary);border-radius:2px;margin-bottom:1.25rem;overflow:hidden}
.prog-fill{height:100%;background:#534AB7;border-radius:2px;transition:width 0.3s}
.nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.nav-cnt{font-size:13px;color:var(--color-text-secondary);font-weight:500}
.btn-row{display:flex;gap:8px}
.ibtn{padding:8px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;font-size:13px;color:var(--color-text-secondary);font-family:var(--font-sans);transition:all 0.15s}
.ibtn:hover{background:var(--color-background-secondary)}
.ibtn.pur{background:#534AB7;color:#fff;border-color:#534AB7}
.ibtn.pur:hover{background:#3C3489}
.fc-mode{display:flex;gap:6px;margin-bottom:1rem}
.mdbtn{padding:7px 14px;border-radius:100px;border:0.5px solid var(--color-border-secondary);background:transparent;cursor:pointer;font-size:13px;color:var(--color-text-secondary);font-family:var(--font-sans)}
.mdbtn.on{background:#534AB7;color:#fff;border-color:#534AB7}

.fc-nav{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:0}
.fc-nav-l,.fc-nav-r{padding:14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;font-size:22px;text-align:center;color:var(--color-text-primary);font-family:var(--font-sans);transition:background 0.1s}
.fc-nav-l:hover,.fc-nav-r:hover{background:var(--color-background-secondary)}
.fc-nav-c{padding:14px;border-radius:var(--border-radius-md);background:#534AB7;color:#fff;border:none;cursor:pointer;font-size:13px;font-family:var(--font-sans);text-align:center}

.quiz-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.5rem;margin-bottom:1rem}
.q-word{font-size:36px;font-weight:500;text-align:center;color:var(--color-text-primary);margin-bottom:6px}
.q-ko{font-size:15px;color:var(--color-text-secondary);text-align:center;margin-bottom:1.5rem}
.q-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.q-hint{font-size:13px;color:var(--color-text-tertiary);font-family:var(--font-mono);min-width:110px}
.q-inp{flex:1;padding:11px 13px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:15px;font-family:var(--font-sans);outline:none;transition:border-color 0.15s}
.q-inp:focus{border-color:#534AB7}
.q-inp.ok{border-color:#1D9E75;background:#E1F5EE}
.q-inp.ng{border-color:#E24B4A;background:#FCEBEB}
.q-badge{width:28px;text-align:center;font-size:15px;font-weight:500}
.qbg-ok{color:#1D9E75}.qbg-ng{color:#E24B4A}

.q-start{text-align:center;padding:2.5rem 1.5rem}
.q-start-title{font-size:22px;font-weight:500;margin-bottom:8px;color:var(--color-text-primary)}
.q-start-sub{font-size:14px;color:var(--color-text-secondary);margin-bottom:1.5rem;line-height:1.6}

.score-wrap{text-align:center;padding:2.5rem 1rem}
.score-ring{width:120px;height:120px;border-radius:50%;border:3px solid #534AB7;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem}
.score-pct{font-size:32px;font-weight:500;color:#3C3489}
.score-sub{font-size:14px;color:var(--color-text-secondary);margin-bottom:1.5rem}
</style>

<div class="app">

<div class="nav">
  <button class="ntab on" onclick="show('browse')"><span class="ni">📖</span>단어장</button>
  <button class="ntab" onclick="show('flash')"><span class="ni">🃏</span>플래시카드</button>
  <button class="ntab" onclick="show('quiz')"><span class="ni">✏️</span>퀴즈</button>
</div>

<div id="browse" class="screen on">
  <div class="stats">
    <div class="st"><div class="st-n">22</div><div class="st-l">전체 단어</div></div>
    <div class="st"><div class="st-n" id="b-done">0</div><div class="st-l">완료</div></div>
    <div class="st"><div class="st-n" id="b-avg">3.8</div><div class="st-l">유의어 평균</div></div>
  </div>
  <input class="search-box" type="text" placeholder="🔍  단어 검색..." oninput="filterW(this.value)">
  <div id="wlist"></div>
</div>

<div id="flash" class="screen">
  <div class="fc-mode">
    <button class="mdbtn on" id="md-en" onclick="setMode('en')">영어 → 유의어</button>
    <button class="mdbtn" id="md-ko" onclick="setMode('ko')">한국어 → 영어</button>
  </div>
  <div class="nav-row">
    <span class="nav-cnt" id="fc-cnt">1 / 22</span>
    <div class="btn-row">
      <button class="ibtn" onclick="shuffleFC()">섞기</button>
      <button class="ibtn" onclick="resetFC()">초기화</button>
    </div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="fc-prog" style="width:4.5%"></div></div>
  <div class="fc-area">
    <div class="fc-wrap" onclick="flipFC()">
      <div class="fc" id="fc">
        <div class="fc-f">
          <div class="fc-front-word" id="ff-word"></div>
          <div class="fc-front-ko" id="ff-sub"></div>
          <div class="fc-tap">탭하여 뒤집기</div>
        </div>
        <div class="fc-b">
          <div class="fc-back-ko" id="fb-top"></div>
          <div class="fc-back-word" id="fb-word"></div>
          <div class="fc-syns" id="fb-syns"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="fc-nav">
    <button class="fc-nav-l" onclick="prevFC()">←</button>
    <button class="fc-nav-c" onclick="markDone()">완료 표시</button>
    <button class="fc-nav-r" onclick="nextFC()">→</button>
  </div>
</div>

<div id="quiz" class="screen">
  <div id="q-start">
    <div class="q-start">
      <div class="q-start-title">유의어 퀴즈</div>
      <div class="q-start-sub">힌트(첫 글자 + 길이)를 보고<br>유의어를 직접 입력하세요</div>
      <button class="ibtn pur" style="font-size:16px;padding:13px 32px" onclick="startQ()">시작하기</button>
    </div>
  </div>
  <div id="q-play" style="display:none">
    <div class="nav-row">
      <span class="nav-cnt" id="q-cnt">1 / 22</span>
      <div class="btn-row">
        <button class="ibtn" onclick="skipQ()">건너뛰기</button>
        <button class="ibtn" onclick="showAns()">정답 보기</button>
      </div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="q-prog" style="width:4.5%"></div></div>
    <div class="quiz-card">
      <div class="q-word" id="q-word"></div>
      <div class="q-ko" id="q-ko"></div>
      <div id="q-rows"></div>
    </div>
    <button class="ibtn pur" style="width:100%;padding:14px;font-size:15px" id="q-action" onclick="qAction()">확인</button>
  </div>
  <div id="q-done" style="display:none">
    <div class="score-wrap">
      <div class="score-ring"><span class="score-pct" id="sc-pct"></span></div>
      <div class="score-sub" id="sc-sub"></div>
      <div class="btn-row" style="justify-content:center;gap:10px">
        <button class="ibtn" onclick="reviewWrong()" id="btn-review">오답 복습</button>
        <button class="ibtn pur" onclick="startQ()">다시 하기</button>
      </div>
    </div>
  </div>
</div>

</div>

<script>
const W=[{w:"draw out",k:"끌어내다",s:["generate","elicit","evoke","trigger","provoke"],h:["g-------","e-----","e----","t------","p------"]},{w:"worthy",k:"가치있는",s:["dependable","trustworthy","invaluable","priceless"],h:["d---------","t----------","i---------","p--------"]},{w:"scarce",k:"희소한",s:["rare","uncommon","insufficient","deficit"],h:["r---","u-------","i-----------","d------"]},{w:"adress",k:"해결하다",s:["solve","resolve","settle"],h:["s----","r------","s-----"]},{w:"level",k:"수평의,평평한",s:["horizontal","even","plane","parrallel"],h:["h---------","e---","p----","p--------"]},{w:"opposite",k:"정반대의",s:["reverse","contrast","inverse"],h:["r------","c-------","i------"]},{w:"go under",k:"파산하다",s:["bankrupt","bust","insolvent"],h:["b-------","b---","i--------"]},{w:"conquer",k:"정복하다",s:["defeat","beat","seize","dominate"],h:["d-----","b---","s----","d-------"]},{w:"persevere",k:"인내하다",s:["persist","endure","strive"],h:["p------","e------","s------"]},{w:"fixed",k:"고정된",s:["fastened","secure","stable","anchored"],h:["f-------","s-----","s-----","a-------"]},{w:"smart",k:"총명함",s:["intelligence","intellect","cleverness"],h:["i-----------","i--------","c---------"]},{w:"effort",k:"노력",s:["endeavor","persistence","commitment","devotion"],h:["e-------","p----------","c---------","d-------"]},{w:"emphasize",k:"강조하다",s:["highlight","stress","underline","feature"],h:["h--------","s-----","u--------","f------"]},{w:"control",k:"통제하다",s:["restrict","regulate","deal","limit"],h:["r-------","r-------","d---","l----"]},{w:"random",k:"임의적인",s:["unsystematic","irregular","arbitrary"],h:["u-----------","i--------","a--------"]},{w:"reverse",k:"반대로",s:["opposite","contrast","inverse"],h:["o-------","c-------","i------"]},{w:"remove",k:"삭제하다",s:["erase","eliminate","replace","discard","scrap"],h:["e----","e--------","r------","d------","s----"]},{w:"adjust",k:"조정하다",s:["modify","amend","revise","qualify","reform"],h:["m-----","a----","r-----","q------","r-----"]},{w:"obvious",k:"명확한",s:["specific","clear","explicit","apparent","evident"],h:["s-------","c----","e-------","a-------","e------"]},{w:"convenience",k:"편리함",s:["accessibility","advantage","expedience"],h:["a------------","a--------","e---------"]},{w:"abstract",k:"추상적인",s:["conceptual","intangible","untouchable"],h:["c---------","i---------","u----------"]},{w:"accidentally",k:"우연히",s:["unintentionally","coincidentally","inadvertently"],h:["u--------------","c-------------","i------------"]}];

let done=new Set(),fcI=0,fcFlip=false,fcMode='en',fcOrd=[...Array(W.length).keys()];
let qI=0,qOrd=[],qSc=0,qTot=0,qAns=false,qWrong=[];

function show(t){
  document.querySelectorAll('.ntab,.screen').forEach(e=>e.classList.remove('on'));
  document.querySelector(`[onclick="show('${t}')"]`).classList.add('on');
  document.getElementById(t).classList.add('on');
  if(t==='flash')renderFC();
  if(t==='browse')renderW(W);
}

function renderW(list){
  document.getElementById('b-done').textContent=done.size;
  const el=document.getElementById('wlist');
  el.innerHTML=list.map(wd=>{
    const gi=W.indexOf(wd),isDone=done.has(gi);
    return`<div class="wcard${isDone?' open':''}" id="wc${gi}" onclick="toggleW(${gi})">
      <div class="wc-top">
        <span class="wc-en">${wd.w}</span>
        <span class="wc-ko">${wd.k}</span>
        <span class="wc-arr">▾</span>
      </div>
      <div class="syn-list" id="sl${gi}" style="display:none">
        ${wd.s.map(s=>`<span class="syn-pill${isDone?' done-pill':''}">${s}</span>`).join('')}
        <div class="wc-actions">
          <button class="act-btn${isDone?' done-act':''}" onclick="event.stopPropagation();toggleDone(${gi})">${isDone?'✓ 완료됨':'완료 표시'}</button>
        </div>
      </div>
    </div>`}).join('');
}

function toggleW(i){
  const sl=document.getElementById('sl'+i),wc=document.getElementById('wc'+i);
  const open=sl.style.display==='none';
  sl.style.display=open?'flex':'none';
  wc.classList.toggle('open',open);
}

function toggleDone(i){
  if(done.has(i))done.delete(i);else done.add(i);
  filterW(document.querySelector('.search-box').value||'');
}

function filterW(q){
  const f=q?W.filter(w=>w.w.toLowerCase().includes(q.toLowerCase())||w.k.includes(q)||w.s.some(s=>s.toLowerCase().includes(q.toLowerCase()))):W;
  renderW(f);
}

function setMode(m){
  fcMode=m;
  document.getElementById('md-en').classList.toggle('on',m==='en');
  document.getElementById('md-ko').classList.toggle('on',m==='ko');
  fcFlip=false;renderFC();
}

function renderFC(){
  const d=W[fcOrd[fcI]];
  document.getElementById('fc-cnt').textContent=(fcI+1)+' / '+W.length;
  document.getElementById('fc-prog').style.width=Math.round((fcI+1)/W.length*100)+'%';
  const fc=document.getElementById('fc');
  fc.classList.remove('flip');fcFlip=false;
  if(fcMode==='en'){
    document.getElementById('ff-word').textContent=d.w;
    document.getElementById('ff-sub').textContent=d.k;
    document.getElementById('fb-top').textContent='유의어 '+d.s.length+'개';
    document.getElementById('fb-word').textContent='';
    document.getElementById('fb-syns').innerHTML=d.s.map(s=>`<span class="syn-pill">${s}</span>`).join('');
  }else{
    document.getElementById('ff-word').textContent=d.k;
    document.getElementById('ff-sub').textContent='영어 단어는?';
    document.getElementById('fb-top').textContent='정답';
    document.getElementById('fb-word').textContent=d.w;
    document.getElementById('fb-syns').innerHTML=d.s.map(s=>`<span class="syn-pill">${s}</span>`).join('');
  }
}

function flipFC(){
  fcFlip=!fcFlip;
  document.getElementById('fc').classList.toggle('flip',fcFlip);
}
function prevFC(){if(fcI>0){fcI--;renderFC();}}
function nextFC(){if(fcI<W.length-1){fcI++;renderFC();}}
function resetFC(){fcI=0;fcOrd=[...Array(W.length).keys()];renderFC();}
function shuffleFC(){fcOrd=[...Array(W.length).keys()].sort(()=>Math.random()-0.5);fcI=0;renderFC();}
function markDone(){done.add(fcOrd[fcI]);nextFC();}

function startQ(){
  qOrd=[...Array(W.length).keys()].sort(()=>Math.random()-0.5);
  qI=0;qSc=0;qTot=0;qWrong=[];qAns=false;
  document.getElementById('q-start').style.display='none';
  document.getElementById('q-done').style.display='none';
  document.getElementById('q-play').style.display='block';
  document.getElementById('q-action').textContent='확인';
  renderQ();
}

function renderQ(){
  qAns=false;
  const d=W[qOrd[qI]];
  document.getElementById('q-cnt').textContent=(qI+1)+' / '+W.length;
  document.getElementById('q-prog').style.width=Math.round((qI+1)/W.length*100)+'%';
  document.getElementById('q-word').textContent=d.w;
  document.getElementById('q-ko').textContent=d.k;
  document.getElementById('q-action').textContent='확인';
  document.getElementById('q-rows').innerHTML=d.s.map((s,j)=>`
    <div class="q-row">
      <span class="q-hint">${d.h[j]||''}</span>
      <input class="q-inp" type="text" id="qi${j}" placeholder="입력..." autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter')qAction()">
      <span class="q-badge" id="qb${j}"></span>
    </div>`).join('');
  setTimeout(()=>document.getElementById('qi0')?.focus(),50);
}

function qAction(){
  if(qAns){nextQ();return;}
  qAns=true;
  const d=W[qOrd[qI]];let sc=0;
  d.s.forEach((s,j)=>{
    const inp=document.getElementById('qi'+j);
    const v=inp.value.trim().toLowerCase();
    const a=s.trim().toLowerCase();
    const ok=v===a||(v.length>=Math.ceil(a.length*0.6)&&a.startsWith(v));
    inp.classList.add(ok?'ok':'ng');
    if(!ok)inp.value=s;
    document.getElementById('qb'+j).textContent=ok?'✓':'✗';
    document.getElementById('qb'+j).className='q-badge '+(ok?'qbg-ok':'qbg-ng');
    if(ok)sc++;
  });
  qTot+=d.s.length;qSc+=sc;
  if(sc<d.s.length)qWrong.push(qOrd[qI]);
  document.getElementById('q-action').textContent='다음 →';
}

function nextQ(){if(qI<W.length-1){qI++;renderQ();}else showResult();}
function skipQ(){qWrong.push(qOrd[qI]);nextQ();}
function showAns(){
  const d=W[qOrd[qI]];
  d.s.forEach((s,j)=>{
    const inp=document.getElementById('qi'+j);
    inp.value=s;inp.classList.add('ok');
    document.getElementById('qb'+j).textContent='→';
  });
  qAns=true;document.getElementById('q-action').textContent='다음 →';
}

function showResult(){
  document.getElementById('q-play').style.display='none';
  document.getElementById('q-done').style.display='block';
  const p=Math.round(qSc/qTot*100);
  document.getElementById('sc-pct').textContent=p+'%';
  document.getElementById('sc-sub').textContent=`${qSc} / ${qTot} 정답  ·  오답 ${qWrong.length}개`;
  document.getElementById('btn-review').style.display=qWrong.length?'':'none';
}

function reviewWrong(){
  if(!qWrong.length)return;
  qOrd=[...qWrong];qWrong=[];qI=0;qSc=0;qTot=0;qAns=false;
  document.getElementById('q-done').style.display='none';
  document.getElementById('q-play').style.display='block';
  renderQ();
}

renderW(W);
</script>
